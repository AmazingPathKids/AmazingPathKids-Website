<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Page not found | Amazing Path Kids</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&amp;display=swap">
<style>
:root{color-scheme:light;--page:#EFEDE7;--panel:#FFFFFF;--soft:#F6F5F1;--ink:#224257;--ink-2:#4A6273;--mute:#667D8D;--sage-text:#2A6F5C;--line:rgba(34,66,87,.12);--btn-bg:#224257;--btn-fg:#FFFFFF;--glass:rgba(255,255,255,.6);--glass-edge:rgba(255,255,255,.85);--glass-hi:rgba(255,255,255,1);--blob:rgba(115,187,163,.22);--badge-bg:#73BBA3;--badge-fg:#142B3B;--badge-shadow:0 0 0 4px rgba(115,187,163,.16),0 10px 28px -6px rgba(115,187,163,.85)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--sage-text);text-decoration:none}
a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--sage-text);outline-offset:3px;border-radius:10px}
@view-transition{navigation:auto}
::view-transition-old(root){animation:apk-out .25s cubic-bezier(.4,0,.2,1) both}
::view-transition-new(root){animation:apk-fade .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes apk-out{to{opacity:0}}
@keyframes apk-fade{from{opacity:0}}
@keyframes apk-in{from{opacity:0;transform:translateY(14px)}}
main{animation:apk-in .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</helmet>

<dc-import name="Site Header" hint-size="100%,0px"></dc-import>

<main id="main" style="padding:12px">
  <section aria-labelledby="nf-title" style="width:100%;max-width:1440px;min-height:min(820px,calc(100vh - 24px));margin:0 auto;box-sizing:border-box;border-radius:clamp(28px,3vw,44px);background:var(--panel);padding:clamp(140px,12vw,170px) clamp(20px,4vw,64px) clamp(64px,8vw,100px);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <span aria-hidden="true" style="position:absolute;left:50%;top:45%;width:600px;height:400px;margin:-200px 0 0 -300px;border-radius:50%;background:#73BBA3;opacity:.2;filter:blur(90px)"></span>
    <img src="/assets/404-plane.png" alt="A toy plane with a surprised young pilot, crashed into a pile of soft building blocks among clouds." width="1536" height="1024" style="position:relative;display:block;width:min(560px,90%);height:auto;margin-top:-20px">
    <p style="position:relative;margin:8px 0 0;font-size:15px;font-weight:600;color:var(--sage-text)">Error 404</p>
    <h1 id="nf-title" style="position:relative;margin:14px auto 0;max-width:12em;font-weight:600;font-size:clamp(38px,5.6vw,82px);line-height:1;letter-spacing:-.04em;text-wrap:balance">This path doesn’t go anywhere. <span style="color:var(--mute)">Let’s find another.</span></h1>
    <p style="position:relative;margin:24px auto 0;max-width:30em;font-size:18px;line-height:1.6;color:var(--ink-2)">The page may have moved, or the link may have a typo. These will get you back on track.</p>
    <div style="position:relative;margin-top:32px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px">
      <a href="/" style="display:inline-flex;align-items:center;min-height:54px;padding:0 28px;border-radius:16px;background:var(--btn-bg);color:var(--btn-fg);font-size:16px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 30px -12px rgba(34,66,87,.7)">Back to home</a>
      <a href="/how-it-works" style="display:inline-flex;align-items:center;min-height:54px;padding:0 26px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:600">How UpPrism works</a>
      <a href="/contact" style="display:inline-flex;align-items:center;min-height:54px;padding:0 26px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink);font-size:16px;font-weight:600">Contact us</a>
    </div>
  </section>
</main>

<dc-import name="Site Footer" hint-size="100%,420px"></dc-import>
</x-dc>
</body>
</html>
